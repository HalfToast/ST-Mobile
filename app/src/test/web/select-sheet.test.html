<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>select-sheet tests</title>
<script src="../../main/assets/web/select-sheet.js"></script>
<style>
  body { background: rgb(24,24,27); color: rgb(195,195,195); font-family: sans-serif; padding: 16px; }
  select { display: block; width: 100%; margin: 6px 0 18px; padding: 8px; font-size: 16px; }
</style>
</head>
<body>
<div id="fixtures">
  <div>
    <h4>Chat Completion Source</h4>
    <select id="chat_completion_source">
      <optgroup>
        <option value="openai">OpenAI</option>
        <option value="custom">Custom (OpenAI-compatible)</option>
      </optgroup>
      <optgroup>
        <option value="ai21">AI21</option>
        <option value="aimlapi">AI/ML API</option>
        <option value="azure_openai">Azure OpenAI</option>
        <option value="chutes">Chutes</option>
        <option value="claude">Claude</option>
        <option value="cloudflare">Cloudflare Workers AI</option>
        <option value="cohere">Cohere</option>
        <option value="deepseek">DeepSeek</option>
      </optgroup>
    </select>
  </div>
  <div>
    <label for="yes_no">Yes/No</label>
    <select id="yes_no"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>
  <div>
    <small>Letters</small>
    <select id="letters" multiple>
      <option value="a">a</option><option value="b">b</option><option value="c">c</option>
    </select>
  </div>
  <div>
    <select id="named_groups" aria-label="Named groups">
      <optgroup label="Fruit"><option value="apple">Apple</option></optgroup>
      <optgroup label="Veg"><option value="leek" disabled>Leek</option><option value="kale">Kale</option></optgroup>
    </select>
  </div>
  <div>
    <select id="hiding" aria-label="Hiding">
      <option value="a">A</option>
      <option value="b" hidden>B</option>
      <option value="c" style="display: none">C</option>
      <option value="d" class="displayNone">D</option>
      <optgroup label="Gone" class="displayNone"><option value="g">G</option></optgroup>
      <optgroup label="Locked" disabled><option value="e">E</option></optgroup>
    </select>
  </div>
  <div id="big_box"><label for="big">Big list</label></div>
  <select id="size_four" size="4"><option>1</option><option>2</option><option>3</option><option>4</option></select>
  <select id="disabled_select" disabled><option>x</option></select>
</div>
<script>
(function () {
  var source = document.getElementById('chat_completion_source');
  var yesNo = document.getElementById('yes_no');
  var letters = document.getElementById('letters');
  var named = document.getElementById('named_groups');
  var sizeFour = document.getElementById('size_four');
  var disabled = document.getElementById('disabled_select');
  var fixtures = document.getElementById('fixtures');
  var hiding = document.getElementById('hiding');
  // HalfToast's NanoGPT model list is a native select with hundreds of options.
  var big = document.createElement('select');
  big.id = 'big';
  for (var n = 0; n < 1000; n++) {
    var opt = document.createElement('option');
    opt.value = 'v' + n;
    opt.textContent = 'opt ' + n;
    big.appendChild(opt);
  }
  document.getElementById('big_box').appendChild(big);

  var events = [];
  // The app's STMobileSheet web message listener, stubbed: records what the page posts.
  var posted = [];
  window.STMobileSheet = { postMessage: function (m) { posted.push(m); } };
  ['input', 'change'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (fixtures.contains(e.target)) events.push(e.type);
    }, true);
  });

  function down(el) {
    var ev = new MouseEvent('mousedown', { bubbles: true, cancelable: true });
    el.dispatchEvent(ev);
    return ev.defaultPrevented;
  }
  // A real tap: the pointer goes down inside the sheet, then the click.
  function tap(el) {
    el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    el.click();
  }
  // A one-finger touch on the sheet's grab area (our handlers only read touches[0].clientY).
  function touch(el, type, y) {
    var ev = new Event(type, { bubbles: true });
    ev.touches = y === undefined ? [] : [{ clientY: y }];
    el.dispatchEvent(ev);
  }
  function dialog() { return document.getElementById('stm-select-sheet'); }
  function sheet() { return document.querySelector('#stm-select-sheet.stm-open'); }
  function q(sel) { return document.querySelector('#stm-select-sheet ' + sel); }
  function visibleRows() {
    return Array.prototype.filter.call(document.querySelectorAll('#stm-select-sheet .stm-row'), function (r) {
      return !r.hidden;
    });
  }
  function rowByText(text) {
    return visibleRows().filter(function (r) { return r.textContent.trim() === text; })[0];
  }
  function eq(actual, expected, what) {
    var a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error(what + ': expected ' + e + ', got ' + a);
  }
  function ok(cond, what) { if (!cond) throw new Error(what); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var tests = {
    bridgeReportsOpenThenEachClose: function () {
      var closers = {
        pick: function () { source.value = 'openai'; down(source); tap(rowByText('AI21')); },
        dim: function () { down(source); tap(q('.stm-dim')); },
        escape: function () {
          down(source);
          document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        },
        cancel: function () {
          down(source);
          document.getElementById('stm-select-sheet').dispatchEvent(new Event('cancel', { cancelable: true }));
        },
        swipe: function () {
          down(source);
          var head = q('.stm-head');
          touch(head, 'touchstart', 100);
          touch(head, 'touchmove', 300);
          touch(head, 'touchend');
        },
        done: function () { down(letters); tap(q('.stm-done')); },
      };
      Object.keys(closers).forEach(function (how) {
        posted.length = 0;
        closers[how]();
        ok(!sheet(), how + ': closed');
        eq(posted, ['open', 'closed'], how + ': posted');
      });
    },
    bridgeReportsCloseOnMutation: function () {
      down(yesNo);
      eq(posted, ['open'], 'posted on open');
      var o = document.createElement('option');
      o.textContent = 'Maybe';
      yesNo.appendChild(o);
      return wait(50).then(function () {
        yesNo.removeChild(o);
        ok(!sheet(), 'closed');
        eq(posted, ['open', 'closed'], 'posted');
      });
    },
    opensSheetAndPreventsNative: function () {
      eq(down(source), true, 'mousedown prevented');
      ok(sheet(), 'sheet open');
      eq(q('.stm-title').textContent.trim(), 'Chat Completion Source', 'title');
      eq(document.querySelectorAll('#stm-select-sheet .stm-row').length, 10, 'rows');
      eq(document.querySelectorAll('#stm-select-sheet .stm-divider').length, 1, 'dividers');
      eq(window.__stmSelectSheet.isOpen(), true, 'isOpen');
    },
    marksCurrent: function () {
      source.value = 'claude';
      down(source);
      var sel = document.querySelectorAll('#stm-select-sheet .stm-row.stm-selected');
      eq(sel.length, 1, 'selected rows');
      eq(sel[0].textContent.trim(), 'Claude', 'selected text');
      eq(sel[0].getAttribute('data-index'), String(source.selectedIndex), 'data-index');
    },
    pickAppliesAndFiresEvents: function () {
      source.value = 'openai';
      down(source);
      tap(rowByText('AI21'));
      eq(source.value, 'ai21', 'value');
      eq(events, ['input', 'change'], 'events');
      ok(!sheet(), 'sheet closed');
    },
    repickCurrentFiresNothing: function () {
      source.value = 'claude';
      down(source);
      tap(rowByText('Claude'));
      eq(source.value, 'claude', 'value');
      eq(events, [], 'events');
      ok(!sheet(), 'sheet closed');
    },
    searchOnlyOnLongLists: function () {
      down(source);
      var search = q('.stm-search');
      ok(search && !search.hidden, 'search shown for 10 options');
      search.value = 'cl';
      search.dispatchEvent(new Event('input', { bubbles: true }));
      eq(visibleRows().map(function (r) { return r.textContent.trim(); }), ['Claude', 'Cloudflare Workers AI'], 'filtered');
      ok(q('.stm-empty').hidden, 'no empty text while matching');
      search.value = 'zzz';
      search.dispatchEvent(new Event('input', { bubbles: true }));
      eq(visibleRows().length, 0, 'no rows');
      ok(!q('.stm-empty').hidden, 'empty text shown');
      eq(q('.stm-empty').textContent, 'No matches', 'empty text');
      eq(events, [], 'search typing is not a select event');
      window.__stmSelectSheet.close();
      down(yesNo);
      var s2 = q('.stm-search');
      ok(!s2 || s2.hidden, 'no search for 2 options');
      eq(q('.stm-title').textContent.trim(), 'Yes/No', 'label[for] title');
      eq(visibleRows().length, 2, 'search reset on reopen');
    },
    escapeAndDimCloseWithoutChange: function () {
      source.value = 'cohere';
      down(source);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      ok(!sheet(), 'closed by Escape');
      down(source);
      tap(q('.stm-dim'));
      ok(!sheet(), 'closed by dim');
      eq(source.value, 'cohere', 'value');
      eq(events, [], 'events');
    },
    closesOnDialogCancel: function () {
      down(yesNo);
      var root = document.getElementById('stm-select-sheet');
      root.dispatchEvent(new Event('cancel', { cancelable: true }));
      ok(!sheet(), 'closed by cancel');
      eq(events, [], 'events');
    },
    multipleUsesDone: function () {
      down(letters);
      ok(sheet(), 'open');
      eq(q('.stm-title').textContent.trim(), 'Letters', 'sibling title');
      tap(rowByText('a'));
      tap(rowByText('c'));
      ok(sheet(), 'still open after toggles');
      eq(events, [], 'no events before Done');
      tap(q('.stm-done'));
      var vals = Array.prototype.filter.call(letters.options, function (o) { return o.selected; })
        .map(function (o) { return o.value; });
      eq(vals, ['a', 'c'], 'selected');
      eq(events, ['input', 'change'], 'events');
      ok(!sheet(), 'closed');
    },
    multipleDimDiscards: function () {
      letters.options[0].selected = true; letters.options[1].selected = false; letters.options[2].selected = false;
      down(letters);
      tap(rowByText('b'));
      tap(q('.stm-dim'));
      eq(letters.options[1].selected, false, 'b untouched');
      eq(events, [], 'events');
    },
    namedGroupsAndDisabledOptions: function () {
      named.value = 'apple';
      down(named);
      eq(q('.stm-title').textContent.trim(), 'Named groups', 'aria-label title');
      eq(Array.prototype.map.call(document.querySelectorAll('#stm-select-sheet .stm-group'),
        function (g) { return g.textContent.trim(); }), ['Fruit', 'Veg'], 'group headers');
      eq(document.querySelectorAll('#stm-select-sheet .stm-divider').length, 0, 'no dividers');
      var leek = rowByText('Leek');
      ok(leek.classList.contains('stm-disabled'), 'disabled row');
      tap(leek);
      ok(sheet(), 'disabled tap keeps sheet open');
      eq(named.value, 'apple', 'value');
      eq(events, [], 'events');
    },
    longListRendersOnlyAWindow: function () {
      big.selectedIndex = 700;
      down(big);
      ok(sheet(), 'open');
      eq(q('.stm-title').textContent.trim(), 'Big list', 'title from select.labels');
      var rows = document.querySelectorAll('#stm-select-sheet .stm-row');
      ok(rows.length > 0 && rows.length <= 80, 'at most 80 row elements, got ' + rows.length);
      var cur = q('.stm-row[data-index="700"]');
      ok(cur, 'current row rendered');
      ok(cur.classList.contains('stm-selected'), 'current row marked');
      var lr = q('.stm-list').getBoundingClientRect(), cr = cur.getBoundingClientRect();
      ok(cr.top >= lr.top - 1 && cr.bottom <= lr.bottom + 1, 'current row in view');
      ok(Math.abs((cr.top + cr.bottom) / 2 - (lr.top + lr.bottom) / 2) < cr.height, 'current row centred');
    },
    longListSearchAndPickFarDown: function () {
      big.selectedIndex = 0;
      down(big);
      var search = q('.stm-search');
      search.value = 'opt 9';
      search.dispatchEvent(new Event('input', { bubbles: true }));
      ok(q('.stm-empty').hidden, 'matches');
      var texts = visibleRows().map(function (r) { return r.textContent.trim(); });
      eq(texts.slice(0, 3), ['opt 9', 'opt 90', 'opt 91'], 'first matches');
      ok(texts.every(function (t) { return t.indexOf('opt 9') === 0; }), 'only matches rendered');
      ok(texts.length <= 80, 'windowed while searching');
      var list = q('.stm-list');
      list.scrollTop = list.scrollHeight;
      list.dispatchEvent(new Event('scroll'));
      var last = rowByText('opt 999');
      ok(last, 'last match rendered after scrolling down');
      tap(last);
      eq(big.value, 'v999', 'value');
      eq(big.selectedIndex, 999, 'selectedIndex');
      eq(events, ['input', 'change'], 'events');
      ok(!sheet(), 'closed');
    },
    longListScrollRecyclesRows: function () {
      big.selectedIndex = 0;
      down(big);
      var list = q('.stm-list');
      for (var y = 0; y <= list.scrollHeight; y += 900) {
        list.scrollTop = y;
        list.dispatchEvent(new Event('scroll'));
        ok(document.querySelectorAll('#stm-select-sheet .stm-row').length <= 80, 'window at ' + y);
      }
      ok(rowByText('opt 999'), 'reached the end');
      ok(!rowByText('opt 0'), 'top rows recycled');
    },
    hiddenOptionsAndDisabledGroups: function () {
      hiding.value = 'a';
      down(hiding);
      eq(visibleRows().map(function (r) { return r.textContent.trim(); }), ['A', 'E'], 'shown rows');
      eq(q('.stm-row[data-index="5"]').classList.contains('stm-disabled'), true, 'disabled by its optgroup');
      tap(rowByText('E'));
      ok(sheet(), 'still open');
      eq(hiding.value, 'a', 'value');
    },
    pickAppliesBeforeTheSlideEnds: function () {
      source.value = 'openai';
      down(source);
      tap(rowByText('Cohere'));
      eq(source.value, 'cohere', 'value at once');
      eq(events, ['input', 'change'], 'events at once');
      ok(!sheet() && !window.__stmSelectSheet.isOpen(), 'closed for the page at once');
      eq(posted, ['open', 'closed'], 'app told at once');
      ok(dialog().open, 'still sliding down');
      return wait(400).then(function () { ok(!dialog().open, 'dialog closed after the slide'); });
    },
    openDuringACloseWorks: function () {
      down(source);
      tap(q('.stm-dim'));
      ok(dialog().open, 'closing');
      eq(down(yesNo), true, 'second open prevented the native list');
      ok(sheet(), 'open again');
      eq(q('.stm-title').textContent.trim(), 'Yes/No', 'the new list');
      return wait(400).then(function () {
        ok(sheet() && dialog().open, 'the earlier close did not close the new sheet');
      });
    },
    backDuringACloseFinishesIt: function () {
      down(source);
      tap(q('.stm-dim'));
      ok(dialog().open, 'closing');
      var ev = new Event('cancel', { cancelable: true });
      dialog().dispatchEvent(ev);
      ok(!dialog().open, 'closed at once');
      ok(ev.defaultPrevented, 'cancel still handled');
    },
    backWhileOpenSlidesDown: function () {
      down(yesNo);
      dialog().dispatchEvent(new Event('cancel', { cancelable: true }));
      ok(!sheet(), 'closed for the page');
      ok(dialog().open, 'sliding down');
    },
    reducedMotionClosesAtOnce: function () {
      var real = window.matchMedia;
      window.matchMedia = function (query) {
        return { matches: query.indexOf('prefers-reduced-motion: reduce') >= 0 };
      };
      try {
        down(source);
        tap(q('.stm-dim'));
        ok(!dialog().open, 'closed at once');
      } finally {
        window.matchMedia = real;
      }
    },
    listBoxAndDisabledAreNotIntercepted: function () {
      eq(down(sizeFour), false, 'size=4');
      eq(down(disabled), false, 'disabled');
      ok(!sheet(), 'no sheet');
    },
    focusHandlerTouchingTheSelectKeepsItOpen: function () {
      function onFocus() { yesNo.classList.toggle('focused'); }
      yesNo.addEventListener('focus', onFocus);
      try {
        yesNo.blur();
        down(yesNo);
        return wait(50).then(function () {
          ok(sheet(), 'still open after the focus handler changed a class');
        });
      } finally {
        yesNo.removeEventListener('focus', onFocus);
      }
    },
    optionsMutateWhileOpenClosesWithoutChange: function () {
      source.value = 'chutes';
      down(source);
      ok(sheet(), 'open');
      var o = document.createElement('option');
      o.value = 'zz'; o.textContent = 'ZZ';
      source.appendChild(o);
      return Promise.resolve().then(function () { return wait(50); }).then(function () {
        ok(!sheet(), 'closed after mutation');
        eq(source.value, 'chutes', 'value');
        eq(events, [], 'events');
        source.removeChild(o);
      });
    },
    sheetTapsDoNotReachPageHandlers: function () {
      // ST closes unpinned drawers from $('html').on('touchstart mousedown') and other bubble-phase handlers.
      var leaked = [];
      var types = ['touchstart', 'touchmove', 'touchend', 'mousedown', 'mouseup', 'pointerdown', 'pointerup', 'click'];
      function rec(e) { if (e.target.closest && e.target.closest('#stm-select-sheet')) leaked.push(e.type); }
      types.forEach(function (t) {
        document.addEventListener(t, rec);
        document.documentElement.addEventListener(t, rec);
      });
      function fullTap(el) {
        ['pointerdown', 'touchstart', 'touchend', 'pointerup'].forEach(function (t) {
          el.dispatchEvent(new Event(t, { bubbles: true }));
        });
        el.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        el.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
        el.click();
      }
      try {
        source.value = 'openai';
        down(source);
        fullTap(rowByText('Cohere'));
        eq(source.value, 'cohere', 'value');
        eq(events, ['input', 'change'], 'events');
        down(source);
        fullTap(q('.stm-dim'));
        ok(!sheet(), 'closed by dim');
        eq(leaked, [], 'events that reached document/html');
      } finally {
        types.forEach(function (t) {
          document.removeEventListener(t, rec);
          document.documentElement.removeEventListener(t, rec);
        });
      }
    },
    brokenOpenFallsBack: function () {
      var thrown = false;
      Element.prototype.appendChild = function () {
        delete Element.prototype.appendChild;
        thrown = true;
        throw new Error('boom');
      };
      try {
        eq(down(yesNo), false, 'mousedown not prevented');
        ok(thrown, 'open hit appendChild');
        ok(!sheet(), 'no sheet');
        eq(window.__stmSelectSheet.isOpen(), false, 'isOpen');
        eq(posted, [], 'a failed open posts nothing');
        ok(!dialog().open, 'a failed open leaves no dialog in the top layer');
      } finally {
        delete Element.prototype.appendChild;
      }
      eq(down(yesNo), true, 'works again afterwards');
    },
  };

  function finish(result) { document.body.dataset.result = result; }

  document.addEventListener('DOMContentLoaded', function () {
    var names = Object.keys(tests), i = 0;
    function next() {
      if (i >= names.length) return finish('PASS');
      var name = names[i++];
      events.length = 0;
      posted.length = 0;
      Promise.resolve().then(tests[name]).then(function () {
        if (window.__stmSelectSheet) window.__stmSelectSheet.close();
        next();
      }, function (e) {
        finish('FAIL: ' + name + ': ' + (e && e.message));
      });
    }
    next();
  });
})();
</script>
</body>
</html>
